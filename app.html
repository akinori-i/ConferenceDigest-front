<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ConferenceDigest</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #F7F5EF; --surface: #FFFFFF; --border: #E4DFD3; --ink: #22201B;
    --ink-soft: #6B655A; --accent: #1F6F5C; --accent-bg: #F0F6F4; --accent-border: #CFE3DD;
    --warn-bg: #FBF4EC; --warn-border: #E7D9C2; --warn-ink: #8A5A1E;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--ink); }
  h1, h2, h3 { font-family: 'Noto Serif JP', serif; margin: 0; }
  button { font-family: inherit; cursor: pointer; }
  .hidden { display: none !important; }

  /* ---- 設定バー ---- */
  #topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  #topbar h1 { font-size: 18px; }
  #authArea { display: flex; align-items: center; gap: 10px; }
  #whoami { font-size: 13px; color: var(--ink-soft); }
  #settingsBtn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px;
    padding: 6px 12px; font-size: 13px; }

  /* ---- 設定パネル ---- */
  #settingsPanel { position: fixed; inset: 0; background: rgba(0,0,0,.3); display: flex;
    align-items: center; justify-content: center; z-index: 50; }
  #settingsBox { background: var(--surface); border-radius: 16px; padding: 24px; width: 90%; max-width: 360px;
    display: flex; flex-direction: column; gap: 12px; }
  #settingsBox label { font-size: 12.5px; font-weight: 700; color: var(--ink-soft); }
  #settingsBox select, #settingsBox input { width: 100%; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; }
  #settingsBox .row { display: flex; gap: 8px; margin-top: 8px; }
  #settingsBox button.primary { flex: 1; background: var(--accent); color: #fff; border: none;
    border-radius: 8px; padding: 10px 0; font-weight: 700; }
  #settingsBox button.secondary { border: 1px solid var(--border); background: #fff; border-radius: 8px; padding: 10px 14px; }

  /* ---- レイアウト ---- */
  /* 3カラム: 一覧 | 要約 | PDF。幅が足りないときは flex-wrap で折り返す（PDFは既定で隠す） */
  #main { display: flex; flex-wrap: wrap; gap: 20px; max-width: 1800px; margin: 0 auto; padding: 20px; align-items: flex-start; }
  #listPane { flex: 1 1 260px; max-width: 340px; min-width: 240px; display: flex; flex-direction: column; gap: 10px; }
  #detailPane { flex: 1 1 380px; min-width: 0; }
  #pdfPane { flex: 1.5 1 420px; min-width: 0; position: sticky; top: 16px; height: calc(100vh - 90px); min-height: 360px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; display: flex;
    flex-direction: column; overflow: hidden; }
  #pdfPaneHeader { display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 10px 14px; border-bottom: 1px solid var(--border); }
  #pdfPaneTitle { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pdfPaneBody { flex: 1; display: flex; position: relative; min-height: 0; }
  #pdfFrame { flex: 1; border: none; width: 100%; }
  #pdfStatus { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 20px; text-align: center; font-size: 13px; color: var(--ink-soft); }
  @media (max-width: 800px) { #listPane { max-width: none; } }
  .talk-row { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--border);
    border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; text-align: left;
    width: 100%; }
  .talk-row.selected { border-left-color: var(--accent); }
  .talk-row .time { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
  .talk-row .title { font-size: 14.5px; font-weight: 700; }
  .talk-row .speaker { font-size: 12px; color: var(--ink-soft); }

  /* 「現在の発表へ」ボタンとその一時メッセージ */
  .jump-btn { width: 100%; border: 1px solid var(--accent-border); background: var(--accent-bg); color: var(--accent);
    border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 700; }
  .jump-btn:hover { background: #E4F0EC; }
  #jumpToNow { display: flex; flex-direction: column; gap: 6px; }
  .jump-btn.sub { text-align: left; font-weight: 500; line-height: 1.4; }
  .jump-caption { font-size: 12px; font-weight: 700; color: var(--ink-soft); padding: 0 4px; }
  .jump-msg { font-size: 12px; color: var(--warn-ink); margin-top: -4px; padding: 0 4px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px;
    margin-bottom: 14px; }
  .card.section { background: var(--accent-bg); border-color: var(--accent-border); }
  .card .label { font-size: 12.5px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
  .card .body { font-size: 14px; line-height: 1.75; }
  .fig-img { max-width: 100%; border-radius: 8px; border: 1px solid var(--border); margin-top: 6px; }

  .memo-card textarea { width: 100%; min-height: 70px; border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-family: inherit; font-size: 13.5px; }
  .comment-item { display: flex; gap: 8px; font-size: 13px; margin-top: 10px; }
  .comment-item .c-head { font-size: 12px; color: var(--muted, #6b7280); }
  .comment-item .c-text { white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
  .comment-empty { font-size: 12.5px; color: var(--muted, #6b7280); margin-top: 8px; }
  .avatar { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 999px; background: var(--accent);
    color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

  /* ---- 新着コメント通知（画面右上。クリック or ×で閉じるまで残り、縦に積む） ---- */
  #notificationArea { position: fixed; top: 72px; right: 16px; width: min(340px, calc(100vw - 32px)); z-index: 45;
    display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .notif { pointer-events: auto; display: flex; align-items: flex-start; gap: 8px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent);
    border-radius: 10px; padding: 10px 12px; box-shadow: 0 6px 16px rgba(0,0,0,.14); }
  .notif:hover { background: var(--accent-bg); }
  .notif-text { flex: 1; font-size: 13px; line-height: 1.5; }
  .notif-close { border: none; background: transparent; font-size: 16px; line-height: 1; color: var(--ink-soft); padding: 2px 4px; }

  /* ---- 質問フローティングボタン ---- */
  #chatFab { position: fixed; left: 24px; bottom: 24px; width: 52px; height: 52px; border-radius: 999px;
    border: none; background: var(--accent); color: #fff; font-size: 20px; box-shadow: 0 6px 16px rgba(0,0,0,.18); z-index: 40; }
  #chatPanel { position: fixed; left: 24px; bottom: 84px; width: 320px; max-height: 420px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.15); display: flex;
    flex-direction: column; overflow: hidden; z-index: 41; }
  #chatHeader { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px;
    border-bottom: 1px solid var(--border); font-weight: 700; font-size: 13px; }
  #chatBody { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
  .chat-q { align-self: flex-end; max-width: 85%; background: var(--accent); color: #fff; border-radius: 10px 10px 2px 10px; padding: 8px 10px; }
  .chat-a { align-self: flex-start; max-width: 90%; background: var(--bg); border-radius: 10px 10px 10px 2px; padding: 8px 10px; }
  #chatInputRow { display: flex; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--border); }
  #chatInputRow input { flex: 1; border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
  #chatInputRow button { border: none; background: var(--accent); color: #fff; border-radius: 999px; padding: 6px 14px; font-size: 13px; }
</style>
</head>
<body>

<div id="topbar">
  <h1>ConferenceDigest</h1>
  <div id="authArea">
    <span id="whoami"></span>
    <div id="signin-button"></div>
    <button id="settingsBtn" class="hidden">設定</button>
  </div>
</div>

<div id="settingsPanel" class="hidden">
  <div id="settingsBox">
    <h3>AI設定</h3>
    <div>
      <label>プロバイダ</label>
      <select id="providerSelect">
        <option value="claude">Claude</option>
        <option value="openai">OpenAI</option>
        <option value="gemini">Gemini</option>
      </select>
    </div>
    <div>
      <label>APIキー（新しく登録する場合のみ入力）</label>
      <input id="apiKeyInput" type="password" placeholder="sk-ant-... / AIza...">
    </div>
    <div id="settingsStatus" style="font-size:12.5px;color:var(--ink-soft)"></div>
    <div class="row">
      <button class="secondary" id="settingsCloseBtn">閉じる</button>
      <button class="primary" id="settingsSaveBtn">保存</button>
    </div>
  </div>
</div>

<div id="main">
  <div id="listPane"><div style="padding:20px;color:var(--ink-soft)">右上の「Googleでログイン」から始めてください。</div></div>
  <div id="detailPane"></div>
  <!-- 右カラム: PDF常時表示エリア。旧 #pdfModal（ポップアップ）のヘッダ・iframe・閉じるボタンをここに転用した -->
  <div id="pdfPane" class="hidden">
    <div id="pdfPaneHeader">
      <!-- 右上の通知（#notificationArea）と重ならないよう、×は左側に置く -->
      <button id="pdfPaneClose" title="PDFを隠す" style="border:none;background:transparent;font-size:18px">×</button>
      <strong id="pdfPaneTitle" style="flex:1"></strong>
    </div>
    <div id="pdfPaneBody">
      <iframe id="pdfFrame" class="hidden" title="論文PDF"></iframe>
      <div id="pdfStatus">発表を選択するとPDFが表示されます</div>
    </div>
  </div>
</div>

<div id="notificationArea" aria-live="polite"></div>

<button id="chatFab" class="hidden">?</button>
<div id="chatPanel" class="hidden">
  <div id="chatHeader">
    <span id="chatTitle">質問する</span>
    <button id="chatCloseBtn" style="border:none;background:transparent;font-size:16px">×</button>
  </div>
  <div id="chatBody"></div>
  <div id="chatInputRow">
    <input id="chatInput" placeholder="質問を入力...">
    <button id="chatSendBtn">送信</button>
  </div>
</div>

<script>
/* ===== 設定（お使いの環境に合わせて書き換えてください） ===== */
const EXEC_URL = 'https://script.google.com/macros/s/AKfycbwSE6FGqYeTAOgSajnohJcJBSXI8I_dhzukKaXOoYGU40p0kq--q9kuXOY_nNn0-B0fgg/exec'; // Apps ScriptデプロイURL（.../exec）
const GOOGLE_CLIENT_ID = '10331089421-1k6rbns3hvm01sc2vi7nreeg7i9ug766.apps.googleusercontent.com';

/* ===== 状態 ===== */
let idToken = null;
let papers = [];           // summaries.json + schedule.json をマージしたもの
let selectedPaperId = null;

/* ===== データ読み込み（すべてApps Script経由。ログイン済みでないと取得できない） ===== */
async function loadPapers() {
  document.getElementById('listPane').innerHTML =
    '<div style="padding:20px;color:var(--ink-soft)">読み込み中...</div>';
  try {
    const data = await callBackend('listPapers', {});
    papers = data.papers || [];
  } catch (e) {
    document.getElementById('listPane').innerHTML =
      '<div style="padding:20px;color:var(--ink-soft)">論文データの取得に失敗しました: ' + escapeHtml(e.message) + '</div>';
    return;
  }
  renderList();
  if (papers.length) selectPaper(papers[0].paper_id);
}

/* 画像キャッシュ（同じ図を何度も取りに行かないように） */
const imageDataUrlCache = {};
async function fetchImageDataUrl(imgPath) {
  if (imageDataUrlCache[imgPath]) return imageDataUrlCache[imgPath];
  const data = await callBackend('getImage', { path: imgPath });
  const url = 'data:' + data.mimeType + ';base64,' + data.data;
  imageDataUrlCache[imgPath] = url;
  return url;
}

/* ===== 一覧・詳細の描画 ===== */
function renderList() {
  const el = document.getElementById('listPane');
  // 一覧の先頭に「現在の発表へ」ボタン（一覧を作り直すたびに一緒に作り直す）
  el.innerHTML = '<div id="jumpToNow"></div><div id="jumpToNowMsg" class="jump-msg hidden"></div>';
  renderJumpButtons(true);
  papers.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'talk-row' + (p.paper_id === selectedPaperId ? ' selected' : '');
    btn.innerHTML =
      '<div class="time">' + escapeHtml(p.time) + (p.room ? '・' + escapeHtml(p.room) : '') + '</div>' +
      '<div class="title">' + escapeHtml(p.title) + '</div>' +
      '<div class="speaker">' + escapeHtml(p.speaker) + '</div>';
    btn.onclick = () => selectPaper(p.paper_id);
    el.appendChild(btn);
  });
}

/* ===== 「現在の発表へ」 ===== */
// "13:40-14:00" 形式を、今日の日付と組み合わせた {start, end}(Date) にする。
// 「時刻未定」など解釈できない値や、終了が開始より前（日付またぎ）の値は null（判定対象外）。
// 区切りは「ハイフン類・波ダッシュ類の1文字以上の連続」（"10:20-11:40" / "10:20 -- 11:40" / "10:20〜11:40" など）
const TIME_RANGE_RE = /(\d{1,2}):(\d{2})\s*[-‐–—−~～〜ー]+\s*(\d{1,2}):(\d{2})/;
function parseTimeRange(str) {
  const m = TIME_RANGE_RE.exec(String(str || ''));
  if (!m) return null;
  const start = new Date(); start.setHours(+m[1], +m[2], 0, 0);
  const end = new Date();   end.setHours(+m[3], +m[4], 0, 0);
  return end > start ? { start, end } : null;
}

// 該当する発表を、並行セッションも含めてすべて返す（優先順位 a→b→c は従来どおり）
function findCurrentPapers(now) {
  const items = papers.map(p => ({ p, r: parseTimeRange(p.time) })).filter(x => x.r);
  if (!items.length) return [];
  // a. 開始〜終了の範囲内（終了時刻ちょうどは次の発表の開始とみなし、範囲外）
  const current = items.filter(x => x.r.start <= now && now < x.r.end);
  if (current.length) return current.map(x => x.p);
  // b. 開始時刻が最も近い未来の発表（同じ開始時刻のものはすべて）
  const future = items.filter(x => x.r.start > now);
  if (future.length) {
    const t = Math.min(...future.map(x => x.r.start.getTime()));
    return future.filter(x => x.r.start.getTime() === t).map(x => x.p);
  }
  // c. 全部終わっている → 最後に終了した発表（同じ終了時刻のものはすべて）
  const t = Math.max(...items.map(x => x.r.end.getTime()));
  return items.filter(x => x.r.end.getTime() === t).map(x => x.p);
}

// 該当する発表をセッションごとにまとめる。1セッション=1ボタン、遷移先はそのセッションの最初の発表。
// セッション名(session_title)を優先し、無ければ room、それも無ければ時刻文字列で同一視する。
function sessionGroups(now) {
  const groups = new Map();
  findCurrentPapers(now).forEach(p => {
    const key = p.session_title || p.room || ('time:' + p.time);
    if (!groups.has(key)) groups.set(key, { label: p.session_title || p.room || p.title, paper: p });
  });
  return [...groups.values()];
}

let jumpMsgTimer = null;
function showJumpMessage(text) {
  const el = document.getElementById('jumpToNowMsg');
  if (!el) return;
  el.textContent = text;
  el.classList.remove('hidden');
  clearTimeout(jumpMsgTimer);
  jumpMsgTimer = setTimeout(() => {
    const e = document.getElementById('jumpToNowMsg');
    if (e) e.classList.add('hidden');
  }, 2500);
}

function jumpToPaper(paperId) {
  selectPaper(paperId);
  // 一覧が長いと選択行が画面外になるため、見える位置までスクロールする
  const row = document.querySelector('#listPane .talk-row.selected');
  if (row) row.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

// ボタン群の描画。該当セッションが1つ以下 → 従来どおり「現在の発表へ」1つ。
// 並行セッションで2つ以上 → セッション名のボタンを並べる。表示内容が変わらない間は作り直さない。
let jumpSignature = null;
function renderJumpButtons(force) {
  const box = document.getElementById('jumpToNow');
  if (!box) return;
  const groups = sessionGroups(new Date());
  const sig = groups.map(g => g.label + '\u0000' + g.paper.paper_id).join('\u0001');
  if (!force && sig === jumpSignature) return;
  jumpSignature = sig;
  box.innerHTML = '';
  if (groups.length <= 1) {
    const btn = document.createElement('button');
    btn.id = 'jumpToNowBtn';
    btn.className = 'jump-btn';
    btn.textContent = '現在の発表へ';
    btn.onclick = () => {   // 押した時点の時刻で判定し直す
      const g = sessionGroups(new Date());
      if (!g.length) { showJumpMessage('現在時刻に該当する発表が見つかりませんでした'); return; }
      jumpToPaper(g[0].paper.paper_id);
    };
    box.appendChild(btn);
    return;
  }
  const cap = document.createElement('div');
  cap.className = 'jump-caption';
  cap.textContent = '現在の発表へ（並行セッション）';
  box.appendChild(cap);
  groups.forEach((g, i) => {
    const btn = document.createElement('button');
    btn.id = 'jumpToNowBtn-' + (i + 1);
    btn.className = 'jump-btn sub';
    btn.textContent = g.label;
    btn.title = g.label;
    btn.onclick = () => jumpToPaper(g.paper.paper_id);
    box.appendChild(btn);
  });
}
// 時間が進むと該当セッションが変わるため、1分ごと／タブ再表示時に表示を更新する
setInterval(() => { if (!document.hidden && papers.length) renderJumpButtons(false); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) renderJumpButtons(false); });

function selectPaper(paperId) {
  selectedPaperId = paperId;
  renderList();
  renderDetail();
  dismissNotification(paperId);   // 見に行った発表の通知は不要になる
  // 発表を選択するたびに、右カラムへ該当PDFを読み込む（取得済みならキャッシュから即表示）
  const p = papers.find(x => x.paper_id === paperId);
  if (p) openPdfViewer(p.paper_id, p.title);
}

function renderDetail() {
  const p = papers.find(x => x.paper_id === selectedPaperId);
  const el = document.getElementById('detailPane');
  if (!p) { el.innerHTML = ''; return; }

  const figs = (p.key_figures || []).map((f, i) =>
    '<div class="card">' +
    '<div class="label">' + escapeHtml(f.label || '') + '</div>' +
    (f.image_path ? '<img class="fig-img" id="figimg-' + i + '" alt="読み込み中...">' : '') +
    '<div class="body" style="font-size:13px;color:var(--ink-soft);margin-top:6px">' + escapeHtml(f.reason || '') + '</div>' +
    '</div>'
  ).join('');

  el.innerHTML =
    '<div class="card">' +
      '<div style="font-size:13px;font-weight:700;color:var(--accent)">' + escapeHtml(p.time) + (p.room ? '・' + escapeHtml(p.room) : '') + '</div>' +
      '<h2 style="font-size:20px;margin-top:4px">' + escapeHtml(p.title) + '</h2>' +
      '<div style="font-size:13px;color:var(--ink-soft);margin-top:4px">' + escapeHtml(p.speaker) + '</div>' +
      '<button id="viewPdfBtn" style="margin-top:10px;border:1px solid var(--border);background:#fff;' +
        'border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer">' + (pdfVisible ? 'PDFを隠す' : 'PDFを表示') + '</button>' +
    '</div>' +
    section('背景', p.background) +
    section('課題', p.challenge) +
    section('目的', p.purpose) +
    section('アプローチ', p.approach) +
    figs +
    section('結論', p.conclusion) +
    '<div class="card" style="background:var(--warn-bg);border-color:var(--warn-border)">' +
      '<div class="label" style="color:var(--warn-ink)">疑問点</div>' +
      '<div class="body">' + escapeHtml(p.open_questions) + '</div>' +
    '</div>' +
    memoCardHtml();

  loadMemo();
  loadComments();

  // 図表画像を非同期取得して差し込む
  (p.key_figures || []).forEach((f, i) => {
    if (!f.image_path) return;
    fetchImageDataUrl(f.image_path).then(url => {
      const img = document.getElementById('figimg-' + i);
      if (img) img.src = url;
    }).catch(err => {
      const img = document.getElementById('figimg-' + i);
      if (img) img.alt = '画像の取得に失敗しました: ' + err.message;
    });
  });

  // 「PDFを表示/隠す」トグル（右カラムの表示切替。狭い画面では既定で隠れている）
  document.getElementById('viewPdfBtn').onclick = () => setPdfVisible(!pdfVisible);
}

/* ===== PDFビューア（右カラム。旧モーダルを転用） ===== */
// 狭い画面（モバイル等）では既定で隠し、無駄なPDF取得もしない
let pdfVisible = window.matchMedia('(min-width: 1200px)').matches;
const pdfBlobUrlCache = {};   // paperId -> blob: URL（同じ論文のPDFを何度も取得し直さない）
const pdfPending = {};        // paperId -> 取得中のPromise（同時の重複リクエスト防止）

function base64ToBlobUrl(b64, mime) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([bytes], { type: mime }));
}

function fetchPdfBlobUrl(paperId) {
  if (pdfBlobUrlCache[paperId]) return Promise.resolve(pdfBlobUrlCache[paperId]);
  if (pdfPending[paperId]) return pdfPending[paperId];
  pdfPending[paperId] = callBackend('getPdf', { paperId })
    .then(data => (pdfBlobUrlCache[paperId] = base64ToBlobUrl(data.data, 'application/pdf')))
    .finally(() => { delete pdfPending[paperId]; });
  return pdfPending[paperId];
}

function showPdfStatus(msg) {
  document.getElementById('pdfFrame').classList.add('hidden');
  const st = document.getElementById('pdfStatus');
  st.textContent = msg;
  st.classList.remove('hidden');
}

async function openPdfViewer(paperId, title) {
  if (!pdfVisible) return;
  const frame = document.getElementById('pdfFrame');
  document.getElementById('pdfPaneTitle').textContent = title;
  showPdfStatus('PDFを読み込み中...');
  try {
    const url = await fetchPdfBlobUrl(paperId);
    // 取得中に別の発表へ切り替えられた／PDFが隠された場合は、古い結果を描画しない
    if (paperId !== selectedPaperId || !pdfVisible) return;
    frame.src = url + '#view=FitH';
    frame.classList.remove('hidden');
    document.getElementById('pdfStatus').classList.add('hidden');
  } catch (err) {
    if (paperId === selectedPaperId) showPdfStatus('PDFの取得に失敗しました: ' + err.message);
  }
}

function setPdfVisible(visible) {
  pdfVisible = visible;
  document.getElementById('pdfPane').classList.toggle('hidden', !visible);
  const btn = document.getElementById('viewPdfBtn');
  if (btn) btn.textContent = visible ? 'PDFを隠す' : 'PDFを表示';
  if (!visible) { document.getElementById('pdfFrame').src = 'about:blank'; return; }
  const p = papers.find(x => x.paper_id === selectedPaperId);
  if (p) openPdfViewer(p.paper_id, p.title);
}
// 旧 #pdfModalClose の閉じるボタンは、右カラムの「×（PDFを隠す）」に転用
document.getElementById('pdfPaneClose').onclick = () => setPdfVisible(false);
document.getElementById('pdfPane').classList.toggle('hidden', !pdfVisible);

function section(label, text) {
  return '<div class="card section"><div class="label">' + escapeHtml(label) + '</div>' +
    '<div class="body">' + escapeHtml(text || '') + '</div></div>';
}

function memoCardHtml() {
  const btn = 'border:1px solid var(--accent-border);background:var(--accent-bg);color:var(--accent);' +
    'border-radius:8px;padding:6px 14px;font-size:13px;font-weight:700';
  return '<div class="card memo-card">' +
    '<div class="label" style="color:var(--ink)">自分のメモ（自分だけに表示）</div>' +
    '<textarea id="memoText" placeholder="感想やアイデアをメモ..."></textarea>' +
    '<button id="memoSaveBtn" style="margin-top:8px;' + btn + '">保存</button>' +
  '</div>' +
  '<div class="card memo-card">' +
    '<div class="label" style="color:var(--ink)">コメント（研究室の全員に表示・投稿後は編集/削除できません）</div>' +
    '<div id="commentList"></div>' +
    '<textarea id="commentText" style="margin-top:10px" placeholder="コメントを書く..."></textarea>' +
    '<button id="commentPostBtn" style="margin-top:8px;' + btn + '">投稿する</button>' +
  '</div>';
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

/* ===== Apps Script 呼び出し ===== */
async function callBackend(action, payload) {
  if (!idToken) throw new Error('ログインしていません');
  const res = await fetch(EXEC_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ idToken, action, payload }),
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error);
  return json.data;
}

/* ===== 自分のメモ（個人・非公開） ===== */
async function loadMemo() {
  if (!idToken || !selectedPaperId) return;
  const pid = selectedPaperId;
  try {
    const data = await callBackend('getMemo', { paperId: pid });
    if (pid !== selectedPaperId) return;   // 取得中に別の発表へ移った
    const textEl = document.getElementById('memoText');
    if (textEl) textEl.value = data.personal || '';
  } catch (e) { /* 未ログイン時は静かに諦める */ }
}

/* ===== コメント（全員に見える・追記のみ） ===== */
function formatCommentTime(iso) {
  const d = new Date(iso);
  if (!iso || isNaN(d.getTime())) return String(iso || '');
  return d.toLocaleString('ja-JP', { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function renderComments(comments) {
  const el = document.getElementById('commentList');
  if (!el) return;
  if (!comments.length) { el.innerHTML = '<div class="comment-empty">まだコメントはありません</div>'; return; }
  el.innerHTML = comments.map(c =>   // サーバーが古い順に返す。並べ替えずそのまま表示
    '<div class="comment-item"><div class="avatar">' + escapeHtml((c.displayName || '?')[0]) + '</div>' +
    '<div><div class="c-head"><b>' + escapeHtml(c.displayName || '匿名') + '</b> · ' +
    escapeHtml(formatCommentTime(c.createdAt)) + '</div>' +
    '<div class="c-text">' + escapeHtml(c.text) + '</div></div></div>'
  ).join('');
}

async function loadComments() {
  if (!idToken || !selectedPaperId) return;
  const pid = selectedPaperId;
  try {
    const data = await callBackend('getComments', { paperId: pid });
    if (pid !== selectedPaperId) return;
    renderComments(data.comments || []);
  } catch (e) {
    const el = document.getElementById('commentList');
    if (el && pid === selectedPaperId) el.innerHTML = '<div class="comment-empty">コメントを取得できませんでした</div>';
  }
}

document.addEventListener('click', async (e) => {
  const id = e.target && e.target.id;
  if (id === 'memoSaveBtn') {
    const btn = e.target, text = document.getElementById('memoText').value;
    if (btn.disabled) return;
    btn.disabled = true; btn.textContent = '保存中…';   // 応答待ちが見えるようにする
    let label = '保存';
    try {
      await callBackend('saveMemo', { paperId: selectedPaperId, text });
      label = '保存しました ✓';
    } catch (err) { label = '保存失敗'; alert('メモの保存に失敗しました: ' + err.message); }
    btn.disabled = false; btn.textContent = label;
    if (label !== '保存') setTimeout(() => { if (btn.isConnected && !btn.disabled) btn.textContent = '保存'; }, 2000);
  } else if (id === 'commentPostBtn') {
    const btn = e.target, input = document.getElementById('commentText');
    const text = input.value.trim(), pid = selectedPaperId;
    if (!text || btn.disabled) return;
    btn.disabled = true;   // 二重投稿防止
    try {
      const data = await callBackend('postComment', { paperId: pid, text });
      if (pid === selectedPaperId) {
        renderComments(data.comments || []);
        const cur = document.getElementById('commentText');
        if (cur) cur.value = '';
      }
    } catch (err) { alert('コメントの投稿に失敗しました: ' + err.message); }   // 入力は残す
    finally { btn.disabled = false; }
  }
});

/* ===== 他の発表への新着コメント通知 ===== */
const MEMO_POLL_MS = 30000;
let memoSince = null;             // 前回チェック時刻。2回目以降はサーバーが返した checkedAt を使う
let memoPollTimer = null;
let memoPollInFlight = false;     // 応答待ち中の二重呼び出し防止
const notifications = new Map();  // paperId -> { paperId, displayName, count }（同じ発表は1通知にまとめる）

function startMemoPolling() {
  if (!memoSince) memoSince = new Date().toISOString();   // 初回は「ログインした時刻」
  stopMemoPolling();
  if (document.hidden) return;                           // 非表示中は開始しない（再表示で再開）
  memoPollTimer = setInterval(pollMemoUpdates, MEMO_POLL_MS);
}
function stopMemoPolling() {
  if (memoPollTimer) clearInterval(memoPollTimer);
  memoPollTimer = null;
}

async function pollMemoUpdates() {
  if (!idToken || document.hidden || memoPollInFlight) return;
  memoPollInFlight = true;
  try {
    const data = await callBackend('listMemoUpdates', { since: memoSince });
    // 取りこぼし・重複を防ぐため、ローカルのDate.now()ではなくサーバーのcheckedAtで進める
    if (data.checkedAt) memoSince = data.checkedAt;
    handleMemoUpdates(data.updates || []);
  } catch (e) { /* 通信失敗時はsinceを進めず、次回の呼び出しで取り直す */ }
  finally { memoPollInFlight = false; }
}

function handleMemoUpdates(updates) {
  let changed = false;
  updates.forEach(u => {
    if (!u.paperId || u.paperId === selectedPaperId) return;   // 今見ている発表には通知しない
    const n = notifications.get(u.paperId) || { paperId: u.paperId, displayName: '', count: 0 };
    n.displayName = u.displayName || n.displayName;
    n.count += 1;
    notifications.set(u.paperId, n);
    changed = true;
  });
  if (changed) renderNotifications();
}

function renderNotifications() {
  const el = document.getElementById('notificationArea');
  el.innerHTML = '';
  notifications.forEach(n => {
    const p = papers.find(x => x.paper_id === n.paperId);
    const text = (n.displayName || 'だれか') + 'さんが「' + (p ? p.title : n.paperId) + '」にコメントしました' +
      (n.count > 1 ? ' 他' + (n.count - 1) + '件' : '');
    const item = document.createElement('div');
    item.className = 'notif';
    item.dataset.paperId = n.paperId;
    item.tabIndex = 0;
    item.setAttribute('role', 'button');
    item.innerHTML = '<div class="notif-text">' + escapeHtml(text) + '</div>' +
      '<button class="notif-close" aria-label="通知を閉じる">×</button>';
    el.appendChild(item);
  });
}

function dismissNotification(paperId) {
  if (notifications.delete(paperId)) renderNotifications();
}

document.getElementById('notificationArea').addEventListener('click', (e) => {
  const item = e.target.closest('.notif');
  if (!item) return;
  if (e.target.closest('.notif-close')) { dismissNotification(item.dataset.paperId); return; }
  selectPaper(item.dataset.paperId);   // 該当発表へジャンプ（selectPaper内で通知も消える）
});
document.getElementById('notificationArea').addEventListener('keydown', (e) => {
  const item = e.target.closest('.notif');
  if (item && e.target === item && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); selectPaper(item.dataset.paperId); }
});

// タブが見えない間はポーリングを止め、戻ってきたら即1回確認してから再開する
document.addEventListener('visibilitychange', () => {
  if (!idToken) return;
  if (document.hidden) { stopMemoPolling(); return; }
  pollMemoUpdates();
  startMemoPolling();
});

/* ===== 質問パネル ===== */
document.getElementById('chatFab').onclick = () => {
  document.getElementById('chatPanel').classList.toggle('hidden');
};
document.getElementById('chatCloseBtn').onclick = () => {
  document.getElementById('chatPanel').classList.add('hidden');
};
document.getElementById('chatSendBtn').onclick = sendChat;
// 送信は Ctrl+Enter（Win/Linux）/ Cmd+Enter（Mac）のみ。Enter単体は、日本語IMEの変換確定と
// 区別できない場面があるため送信しない（誤送信防止）。
const chatInputEl = document.getElementById('chatInput');
let chatComposing = false;   // IME変換中（compositionstart〜compositionend）
chatInputEl.addEventListener('compositionstart', () => { chatComposing = true; });
chatInputEl.addEventListener('compositionend', () => { chatComposing = false; });
chatInputEl.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  // IME変換中のEnter。Safariは確定のkeydownより先にcompositionendが来るため、keyCode 229も見る
  if (e.isComposing || chatComposing || e.keyCode === 229) return;
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    sendChat();
  }
});
// OSに応じた送信キーのヒントをplaceholderに出す（厳密な判定は不要）
const isMacLike = /Mac|iPhone|iPad/i.test((navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '');
chatInputEl.placeholder = '質問を入力... (' + (isMacLike ? 'Cmd' : 'Ctrl') + '+Enterで送信)';

async function sendChat() {
  const input = document.getElementById('chatInput');
  const question = input.value.trim();
  if (!question) return;
  const p = papers.find(x => x.paper_id === selectedPaperId);
  const context = p ? [p.background, p.challenge, p.purpose, p.approach, p.conclusion].join('\n') : '';
  const body = document.getElementById('chatBody');
  body.innerHTML += '<div class="chat-q">' + escapeHtml(question) + '</div>';
  input.value = '';
  body.scrollTop = body.scrollHeight;
  try {
    const data = await callBackend('ask', { question, context });
    body.innerHTML += '<div class="chat-a">' + escapeHtml(data.answer) + '</div>';
  } catch (err) {
    body.innerHTML += '<div class="chat-a">エラー: ' + escapeHtml(err.message) + '</div>';
  }
  body.scrollTop = body.scrollHeight;
}

/* ===== ログイン ===== */
function base64UrlDecode(str) {
  str = str.replace(/-/g, '+').replace(/_/g, '/');
  while (str.length % 4) str += '=';
  // atob()はバイト単位の文字列しか返さないため、日本語名などの非ASCII文字は
  // そのままJSON.parseすると文字化けする。TextDecoderで明示的にUTF-8として
  // 解釈し直す。
  const binary = atob(str);
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}

window.onload = () => {
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onSignIn });
  google.accounts.id.renderButton(document.getElementById('signin-button'), { theme: 'outline', size: 'medium' });
};

async function onSignIn(response) {
  idToken = response.credential;
  try {
    const payload = JSON.parse(base64UrlDecode(idToken.split('.')[1]));
    document.getElementById('whoami').textContent = payload.name || payload.email;
  } catch (e) { document.getElementById('whoami').textContent = 'ログイン済み'; }

  document.getElementById('signin-button').classList.add('hidden');
  document.getElementById('settingsBtn').classList.remove('hidden');
  document.getElementById('chatFab').classList.remove('hidden');

  // ログイン（本人確認）が済んでから、はじめて論文データを取得しにいく
  loadPapers();
  startMemoPolling();   // 他の発表への新着コメントを30秒おきに確認

  try {
    const settings = await callBackend('getSettings', {});
    document.getElementById('providerSelect').value = settings.provider;
    document.getElementById('settingsStatus').textContent =
      settings.hasKey ? (settings.provider + 'のAPIキー登録済み') : 'APIキー未登録です';
  } catch (e) { /* 初回は無視 */ }
}

/* ===== 設定パネル ===== */
document.getElementById('settingsBtn').onclick = () => document.getElementById('settingsPanel').classList.remove('hidden');
document.getElementById('settingsCloseBtn').onclick = () => document.getElementById('settingsPanel').classList.add('hidden');
document.getElementById('settingsSaveBtn').onclick = async () => {
  const provider = document.getElementById('providerSelect').value;
  const apiKey = document.getElementById('apiKeyInput').value.trim();
  try {
    const data = await callBackend('setSettings', apiKey ? { provider, apiKey } : { provider });
    document.getElementById('settingsStatus').textContent =
      data.hasKey ? (data.provider + 'のAPIキー登録済み') : 'APIキー未登録です';
    document.getElementById('apiKeyInput').value = '';
  } catch (err) {
    document.getElementById('settingsStatus').textContent = 'エラー: ' + err.message;
  }
};
